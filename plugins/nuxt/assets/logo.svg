<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="nuxtBrandGrad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00DC82"/>
      <stop offset="100%" stop-color="#36E4DA"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 10% margin padding: content sits inside 26px - 230px -->
  <rect x="28" y="28" width="200" height="200" rx="44" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2"/>

  <!-- Nuxt Icon Geometry -->
  <g transform="translate(28, 28) scale(0.78)" filter="url(#softGlow)">
    <!-- Back Peak -->
    <path d="M 166.5 68 C 172.5 58 186.5 58 192.5 68 L 244 156 C 250 166 243 179 231 179 L 87 179 C 75 179 68 166 74 156 L 105 104 C 111 94 125 94 131 104 L 148 133 Z" 
          fill="none" 
          stroke="url(#nuxtBrandGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Front Peak -->
    <path d="M 68.5 125 C 74.5 115 88.5 115 94.5 125 L 126 179 L 11 179 C -1 179 -8 166 -2 156 Z" 
          fill="none" 
          stroke="url(#nuxtBrandGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
